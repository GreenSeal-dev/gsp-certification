{% macro level_badges(levels) %}<span class="badges">{% for lv in levels %}<span class="badge badge-l{{ lv }}" title="{{ level_info[lv].name if lv in level_info else 'Level ' ~ lv }}">L{{ lv }}</span>{% endfor %}</span>{% endmacro %}

{% macro priority_tag(priority) %}<span class="tag tag-{{ priority|lower }}">{{ priority }}</span>{% endmacro %}
